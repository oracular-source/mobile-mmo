<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ashfen Hollow showcase</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a quiet showcase from the crypt, plain and clear on a phone.
   IDEA: a reel of film clips laid on stone slabs, newest first, each with a short note.
   PICTURE: the clips themselves, big and pixel-crisp.
   COLOUR and TYPE: crypt blue-black, bone cream, grave-light purple accent; Cinzel titles, Inter text.
   LAYOUT: one column on phones, two a row on wide screens; filter chips on top.
   The page reads clips.json (one entry per clip). To add a clip: put the file beside it, add an entry, republish. */
:root{color-scheme:dark;--bg:#0d0e16;--slab:#171925;--ink:#e8e2d2;--dim:#a49d8c;--bone:#e8e0c8;--glow:#b48cff}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
header{padding:28px max(5vw,16px) 4px;max-width:1100px;margin:auto}
h1{font:600 clamp(28px,6vw,42px)/1.05 Cinzel,serif;margin:0 0 8px;color:var(--bone);text-wrap:balance}
header p{margin:0 0 14px;color:var(--dim);max-width:62ch}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font:600 14px Inter,sans-serif;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid #34374a;background:transparent;color:var(--ink);cursor:pointer}
.chips button[aria-pressed=true]{background:var(--bone);color:var(--bg);border-color:var(--bone)}
.chips button:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.reel{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px;padding:18px max(5vw,16px) 40px;max-width:1100px;margin:auto}
.clip{background:var(--slab);border-radius:10px;overflow:hidden;box-shadow:0 10px 30px #0008}
.clip img{display:block;width:100%;aspect-ratio:1;image-rendering:pixelated;background:#000}
.clip video{display:block;width:100%;max-height:80vh;background:#000}
.clip>div{padding:14px 16px 18px}
.clip h2{font:600 20px/1.2 Cinzel,serif;margin:0 0 6px;color:var(--bone)}
.clip p{margin:0;color:var(--dim);font-size:15px}
.meta{font-size:13px;color:var(--glow);margin-bottom:6px}
.empty{color:var(--dim);padding:20px 0}
@media(prefers-reduced-motion:reduce){.chips button{transition:none}}
</style></head><body>
<header>
<h1>Ashfen Hollow showcase</h1>
<p>Clips recorded from the real game at normal speed, newest first. Every new animation, boss move or video lands here.</p>
<nav class="chips" id="chips" aria-label="Filter clips"></nav>
</header>
<main class="reel" id="reel"><p class="empty">Loading clips…</p></main>
<script>
{
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reel=document.getElementById('reel'),chips=document.getElementById('chips');
let clips=[],tag='All';
const card=c=>{const f=esc(c.file),media=/\.(mp4|webm)$/i.test(c.file)?'<video src="'+f+'" controls playsinline preload="metadata"></video>':'<img src="'+f+'" alt="'+esc(c.title)+'" loading="lazy">';
  return '<section class="clip">'+media+'<div><div class="meta">'+esc(c.tag)+' · '+esc(c.version)+' · '+esc(c.date)+'</div><h2>'+esc(c.title)+'</h2><p>'+esc(c.note)+'</p></div></section>'};
const draw=()=>{const list=clips.filter(c=>tag==='All'||c.tag===tag);
  reel.innerHTML=list.length?list.map(card).join(''):'<p class="empty">No clips here yet.</p>';
  const tags=['All',...new Set(clips.map(c=>c.tag))];
  chips.innerHTML=tags.map(t=>'<button type="button" aria-pressed="'+(t===tag)+'">'+esc(t)+'</button>').join('')};
chips.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tag=b.textContent;draw()});
fetch('clips.json').then(r=>r.json()).then(d=>{clips=d.slice().sort((a,b)=>(b.date+b.version).localeCompare(a.date+a.version,undefined,{numeric:true}));draw()})
  .catch(()=>{reel.innerHTML='<p class="empty">The clip list didn’t load. Try reloading the page.</p>'});
}
</script>
</body></html>
